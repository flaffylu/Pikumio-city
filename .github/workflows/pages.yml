name: Downloadseite veroeffentlichen

# Stellt den Ordner "site" als Webseite bereit:
# https://flaffylu.github.io/Pikumio-city/
on:
  push:
    branches: [main, master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
